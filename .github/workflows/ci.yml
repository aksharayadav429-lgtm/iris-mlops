name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Train model (enforces accuracy gate)
        run: python -m src.train
      - name: Run tests
        run: python -m pytest -q
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-model
          path: models/
      - name: Build Docker image (also re-trains inside the image)
        run: docker build -t iris-mlops:${{ github.sha }} .
      - name: Smoke-test container
        run: |
          docker run -d -p 8000:8000 --name iris iris-mlops:${{ github.sha }}
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}'
