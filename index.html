

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris Flower Classifier</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e4e7ec; --accent:#4f46e5;
          --setosa:#0ea5e9; --versicolor:#f59e0b; --virginica:#8b5cf6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#181c25; --text:#e8ebf1; --muted:#98a2b3; --line:#2a303c; --accent:#818cf8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .card h2 { font-size:1rem; margin:0 0 14px; }
  .field { margin-bottom:16px; }
  .field label { display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:6px; }
  .field output { font-variant-numeric:tabular-nums; color:var(--muted); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .presets { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); padding:8px 12px; }
  button:hover { border-color:var(--accent); }
  button.primary { width:100%; background:var(--accent); color:#fff; border-color:var(--accent); padding:12px; font-weight:600; }
  button.primary:disabled { opacity:.6; cursor:wait; }
  .result-name { font-size:1.9rem; font-weight:700; text-transform:capitalize; margin:4px 0 16px; }
  .placeholder { color:var(--muted); }
  .bar { margin-bottom:12px; }
  .bar .row { display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:4px; text-transform:capitalize; }
  .track { height:10px; border-radius:99px; background:var(--line); overflow:hidden; }
  .fill { height:100%; width:0; border-radius:99px; transition:width .5s ease; }
  .error { color:#dc2626; font-size:.9rem; margin-top:10px; min-height:1.2em; }
  .foot { margin-top:18px; color:var(--muted); font-size:.85rem; text-align:center; }
  .foot a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Iris Flower Classifier</h1>
  <p class="sub">Neural network (MLP) trained on the Iris dataset. Adjust the measurements (in cm) and predict the species.</p>

  <div class="grid">
    <div class="card">
      <h2>Measurements</h2>
      <div class="presets">
        <button type="button" data-preset="5.1,3.5,1.4,0.2">Sample: setosa</button>
        <button type="button" data-preset="6.0,2.9,4.5,1.5">Sample: versicolor</button>
        <button type="button" data-preset="6.7,3.0,5.2,2.3">Sample: virginica</button>
      </div>
      <div class="field"><label for="sepal_length">Sepal length <output id="o_sepal_length"></output></label>
        <input type="range" id="sepal_length" min="4" max="8" step="0.1" value="5.1"></div>
      <div class="field"><label for="sepal_width">Sepal width <output id="o_sepal_width"></output></label>
        <input type="range" id="sepal_width" min="2" max="4.5" step="0.1" value="3.5"></div>
      <div class="field"><label for="petal_length">Petal length <output id="o_petal_length"></output></label>
        <input type="range" id="petal_length" min="1" max="7" step="0.1" value="1.4"></div>
      <div class="field"><label for="petal_width">Petal width <output id="o_petal_width"></output></label>
        <input type="range" id="petal_width" min="0.1" max="2.5" step="0.1" value="0.2"></div>
      <button class="primary" id="go" type="button">Predict</button>
      <div class="error" id="err"></div>
    </div>

    <div class="card">
      <h2>Prediction</h2>
      <div id="result"><p class="placeholder">Press <b>Predict</b> to see the species and the model's confidence.</p></div>
    </div>
  </div>

  <p class="foot" id="foot">Loading model info…</p>
  <p class="foot"><a href="/docs">API docs</a></p>
</div>

<script>
const IDS = ["sepal_length","sepal_width","petal_length","petal_width"];
const COLORS = {setosa:"var(--setosa)", versicolor:"var(--versicolor)", virginica:"var(--virginica)"};
const $ = id => document.getElementById(id);

function syncOutputs(){ IDS.forEach(id => $("o_"+id).textContent = Number($(id).value).toFixed(1) + " cm"); }
IDS.forEach(id => $(id).addEventListener("input", syncOutputs));
syncOutputs();

document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
  b.dataset.preset.split(",").forEach((v,i) => $(IDS[i]).value = v);
  syncOutputs(); predict();
}));

async function predict(){
  const btn = $("go"); $("err").textContent = ""; btn.disabled = true; btn.textContent = "Predicting…";
  const body = {}; IDS.forEach(id => body[id] = parseFloat($(id).value));
  try {
    const r = await fetch("/predict", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (!r.ok) throw new Error("Server returned " + r.status);
    show(await r.json());
  } catch (e) {
    $("err").textContent = "Could not get a prediction: " + e.message + ". If the app was asleep, wait a few seconds and try again.";
  } finally { btn.disabled = false; btn.textContent = "Predict"; }
}

function show(d){
  const res = $("result");
  res.innerHTML = '<div class="result-name" style="color:' + COLORS[d.class_name] + '">Iris ' + d.class_name + '</div>';
  Object.entries(d.probabilities).sort((a,b) => b[1]-a[1]).forEach(([name,p]) => {
    const div = document.createElement("div"); div.className = "bar";
    div.innerHTML = '<div class="row"><span>' + name + '</span><span>' + (p*100).toFixed(1) + '%</span></div>' +
                    '<div class="track"><div class="fill" style="background:' + COLORS[name] + '"></div></div>';
    res.appendChild(div);
    requestAnimationFrame(() => div.querySelector(".fill").style.width = (p*100) + "%");
  });
}
$("go").addEventListener("click", predict);

fetch("/metrics").then(r => r.json()).then(m => {
  if (m.test_accuracy === undefined) { $("foot").textContent = ""; return; }
  $("foot").textContent = "Model test accuracy: " + (m.test_accuracy*100).toFixed(0) + "%" +
    (m.cv_accuracy_5fold ? "  ·  5-fold cross-validation: " + (m.cv_accuracy_5fold*100).toFixed(0) + "%" : "");
}).catch(() => { $("foot").textContent = ""; });
</script>
</body>
</html>
